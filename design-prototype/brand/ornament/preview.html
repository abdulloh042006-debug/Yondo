<style>
:root{--ink:#111111;--paper:#F5F2EC;--carrot:#E8501A;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Manrope Variable",system-ui,sans-serif}
/* ---- the app underneath (stand-in) ---- */
.app{min-height:100%;display:grid;place-content:center;gap:14px;text-align:center;padding:24px}
.app h1{font:600 1.5rem "Space Grotesk Variable",system-ui,sans-serif;margin:0}.app p{margin:0;max-width:44ch;opacity:.75}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctl button{font:inherit;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #1113;background:#fff;color:var(--ink);cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
/* ---- the overlay ---- */
.intro{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:opacity .35s ease}
.intro.fast{transition-duration:.15s}.intro.leaving{opacity:0;pointer-events:none}.intro[hidden]{display:none}
.stage{display:grid;justify-items:center;gap:18px;padding:24px}
.sym{width:min(44vw,168px);height:auto;overflow:visible}
.wm{width:min(56vw,208px);height:auto;opacity:0;transform:translateY(8px);animation:rise .5s var(--ease) 1400ms forwards}
.rule{display:flex;align-items:center;gap:8px;width:min(46vw,150px);opacity:0;transform:scaleX(.2);animation:grow .45s var(--ease) 1500ms forwards}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#F5F2EC99)}.rule i:last-child{transform:scaleX(-1)}
.slogan{margin:0;font:500 clamp(.95rem,3.6vw,1.1rem) "Space Grotesk Variable","Manrope Variable",system-ui,sans-serif;letter-spacing:.02em;opacity:0;animation:fade .45s ease 2000ms forwards}
.draw{stroke-dasharray:100;stroke-dashoffset:100}
.draw.l{animation:draw .8s var(--ease) 250ms forwards}.draw.r{animation:draw .45s var(--ease) 600ms forwards}
.foot{opacity:0;transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.2);animation:foot .26s ease-out 150ms forwards}
.star{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2) rotate(-45deg);animation:bloom .42s cubic-bezier(.34,1.4,.64,1) forwards}
.s1{animation-delay:900ms}.s2{animation-delay:1000ms}
.ring{opacity:0;animation:ring .65s ease-out 1250ms forwards}
.skip{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);min-height:44px;padding:0 20px;border-radius:999px;
 border:1px solid #F5F2EC55;background:transparent;color:var(--paper);font:500 .9rem "Manrope Variable",system-ui,sans-serif;cursor:pointer;opacity:.85}
.skip:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes foot{to{opacity:1;transform:none}}@keyframes bloom{to{opacity:1;transform:none}}
@keyframes ring{0%{opacity:.55;r:10px}100%{opacity:0;r:24px}}@keyframes rise{to{opacity:1;transform:none}}@keyframes grow{to{opacity:1;transform:none}}@keyframes fade{to{opacity:.8}}
/* ---- reduced motion: the final frame at once, opacity-only exit (OS setting or the preview toggle) ---- */
@media (prefers-reduced-motion:reduce){.draw,.foot,.star,.wm,.rule,.slogan{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}.slogan{opacity:.8}.ring{display:none}.intro{transition-duration:.15s}}
.rm .draw,.rm .foot,.rm .star,.rm .wm,.rm .rule,.rm .slogan{animation:none!important;opacity:1;transform:none;stroke-dashoffset:0}.rm .slogan{opacity:.8}.rm .ring{display:none}.rm .intro{transition-duration:.15s}
</style></head><body>

<script>
(function(){
var q=new URLSearchParams(location.search),intro=document.getElementById('intro'),T=[],still=q.get('t');
var L={uz:['Yondo doim yoningda','Ötkazib yuboriş','Qayta körsatiş'],ru:['Yondo. Всегда рядом.','Пропустить','Показать снова'],en:['Yondo, always by your side','Skip','Replay']};
var rmq=window.matchMedia('(prefers-reduced-motion: reduce)');
function rm(){return rmq.matches||document.documentElement.classList.contains('rm')}
function lang(l){document.documentElement.lang=l;document.getElementById('slogan').textContent=L[l][0];document.getElementById('skip').textContent=L[l][1];document.getElementById('replay').textContent=L[l][2];
 document.querySelectorAll('[data-l]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===l)})}
function clear(){T.forEach(clearTimeout);T=[]}
function leave(fast){clear();intro.classList.toggle('fast',!!fast);intro.classList.add('leaving');T.push(setTimeout(function(){intro.hidden=true},fast?150:350))}
function run(){clear();intro.hidden=false;intro.classList.remove('leaving','fast');var c=intro.cloneNode(true);/* restart CSS animations */
 intro.replaceWith(c);intro=c;bind();document.getElementById('skip').focus({preventScroll:true});lang(document.documentElement.lang||'uz');
 if(still!==null)return; T.push(setTimeout(function(){leave(false)},rm()?1200:2450))}
function bind(){intro.addEventListener('pointerdown',function(){leave(true)});document.getElementById('skip').addEventListener('click',function(e){e.stopPropagation();leave(true)})}
document.addEventListener('keydown',function(e){if(!intro.hidden&&(e.key==='Escape'||e.key==='Enter'||e.key===' ')){e.preventDefault();leave(true)}});
document.getElementById('replay').onclick=run;
document.getElementById('rmBtn').onclick=function(){var on=document.documentElement.classList.toggle('rm');this.setAttribute('aria-pressed',on);run()};
document.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){lang(b.dataset.l);run()}});
if(q.get('rm')==='1')document.documentElement.classList.add('rm');
lang(q.get('lang')||'uz');bind();
if(still!==null){requestAnimationFrame(function(){document.getAnimations().forEach(function(a){a.pause();a.currentTime=+still})})}else run();
})();
