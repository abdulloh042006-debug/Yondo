name: Keep Yondo demo responsive

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    # GitHub scheduled runs are best-effort, so this reduces cold starts but is not an uptime guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yondo-demo-availability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe public demo health endpoint
        env:
          HEALTH_URL: https://yondo-demo.onrender.com/health
        run: |
          set -eu
          echo "Checking Yondo demo health endpoint"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 25 \
            --retry 2 \
            --retry-delay 3 \
            --retry-all-errors \
            "$HEALTH_URL"
          echo
          echo "Yondo demo health endpoint responded successfully"
