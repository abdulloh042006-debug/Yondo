# Render Blueprint for the public DEMO (see infra/deploy/README.md before using it).
# Free instances sleep after ~15 minutes without traffic and start again (~1 minute). Without YONDO_DEMO_DATABASE_URL the
# demo data is re-seeded on every start; with it (a free PostgreSQL such as Neon) the data is kept.
# Both variables below are secrets: their values are typed in the Render dashboard and are never stored in this file.
services:
  - type: web
    name: yondo-demo
    runtime: docker
    plan: free
    dockerfilePath: ./infra/deploy/Dockerfile
    dockerContext: .
    branch: design/prototype
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '10000'
      - key: YONDO_DEMO_ADMIN_PHONE
        sync: false
      - key: YONDO_DEMO_DATABASE_URL
        sync: false
