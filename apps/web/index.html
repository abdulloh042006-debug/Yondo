<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ebdf" />
    <meta name="description" content="Yondo doim yoningda — hamroh topiş va xizmatlarni oçiq, xavfsiz tanlaş platformasi." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Yondo — doim yoningda</title>
    <!--
      Opening animation (see apps/web/README.md, "Opening animation"). It is part of the page itself, so it is on
      screen from the first paint, while the app's code and first data load; src/ui/Intro.tsx then drives it and lets
      it leave as soon as the first screen is ready. This script decides, before anything is painted, whether it
      shows at all: only at "/", not when switched off, a short form after the first visit, one still frame (once)
      under prefers-reduced-motion. Storage keys: src/lib/firstRun.ts and INTRO_OFF_KEY in src/ui/Intro.tsx.
    -->
    <script id="yi-decide">
      (function () {
        var mode = 'off', night = false;
        try {
          var off = false, seen = false, theme = '';
          try {
            var s = window.localStorage;
            off = s.getItem('yondo.intro.off') === '1';
            seen = s.getItem('yondo.intro.v1') === '1';
            theme = s.getItem('yondo.theme') || '';
          } catch (e) { /* storage unavailable: treat as a first visit */ }
          var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          if (location.pathname === '/' && !off && !(seen && reduced)) mode = reduced ? 'reduced' : seen ? 'short' : 'full';
          night = /-tun$/.test(theme);
        } catch (e) { mode = 'off'; }
        document.documentElement.setAttribute('data-intro', mode);
        if (night) document.documentElement.setAttribute('data-intro-night', '');
        window.__yondoIntro = { mode: mode, t0: performance.now() };
      })();
    </script>
    <style>
      /* Brand literals only: ink/paper by theme, carrot as graphic. Only transform and opacity are animated.
         Sizes hang on one unit (--yi-u = the symbol), so the lockup keeps the official proportions. */
      .yi {
        --yi-bg: #f5f2ec;
        --yi-fg: #111111;
        --yi-u: clamp(72px, 26vw, 104px);
        --yi-ease: cubic-bezier(0.22, 1, 0.36, 1);
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        place-items: center;
        overflow: hidden;
        color: var(--yi-fg);
      }
      html[data-intro='full'] .yi,
      html[data-intro='short'] .yi,
      html[data-intro='reduced'] .yi {
        display: grid;
      }
      html[data-intro-night] .yi,
      [data-theme$='-tun'] .yi {
        --yi-bg: #111111;
        --yi-fg: #f5f2ec;
      }
      .yi-ground {
        position: absolute;
        inset: 0;
        background: var(--yi-bg);
        transition: opacity 0.45s ease;
      }
      .yi-stage {
        position: relative;
        display: grid;
        justify-items: center;
        gap: calc(var(--yi-u) * 0.22);
      }
      .yi-lockup {
        display: flex;
        align-items: center;
        gap: calc(var(--yi-u) * 0.25);
      }
      .yi-fly,
      .yi-slide,
      .yi-tilt {
        width: var(--yi-u);
        height: var(--yi-u);
      }
      .yi-fly {
        flex: none;
      }
      /* the mark starts in the middle of the frame and makes room for the wordmark later */
      .yi-slide {
        transform: translateX(calc(var(--yi-u) * 1.175));
        animation: yi-settle 0.7s var(--yi-ease) 1400ms forwards;
      }
      .yi-tilt {
        animation: yi-tilt 1.3s var(--yi-ease) both;
      }
      .yi-sym {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .yi-node {
        transform: scale(0);
        animation: yi-settle 0.42s cubic-bezier(0.34, 1.5, 0.64, 1) forwards;
      }
      .yi-node1 {
        transform-origin: 14px 12px;
        animation-delay: 80ms;
      }
      .yi-node2 {
        transform-origin: 50px 12px;
        animation-delay: 170ms;
      }
      .yi-node3 {
        transform-origin: 32px 55px;
        animation-delay: 560ms;
      }
      /* each line grows out of its node, the stem out of the joint */
      .yi-arm {
        transform: scale(0);
        animation: yi-settle 0.42s var(--yi-ease) forwards;
      }
      .yi-arm1 {
        transform-origin: 14px 12px;
        animation-delay: 220ms;
      }
      .yi-arm2 {
        transform-origin: 50px 12px;
        animation-delay: 280ms;
      }
      .yi-stem {
        transform-origin: 32px 40px;
        transform: scaleY(0);
        animation-duration: 0.2s;
        animation-delay: 500ms;
      }
      /* the ripple leaves the accent node once, then keeps a slow pulse for as long as the app is still loading */
      .yi-ring {
        transform-origin: 50px 12px;
        opacity: 0;
      }
      .yi-ring1 {
        animation: yi-ring 0.85s ease-out 1040ms forwards, yi-ring 1.6s ease-out 3000ms infinite;
      }
      .yi-ring2 {
        animation: yi-ring 1s ease-out 1200ms forwards;
      }
      .yi-sweep {
        fill: var(--yi-bg);
        opacity: 0;
        animation: yi-sweep 0.7s ease-in-out 1120ms forwards;
      }
      .yi-wmclip {
        width: calc(var(--yi-u) * 2.1);
        overflow: hidden;
        transition: opacity 0.22s ease;
      }
      .yi-wm {
        display: block;
        width: 100%;
        height: auto;
        opacity: 0;
        transform: translateX(-104%);
        animation: yi-settle 0.7s var(--yi-ease) 1400ms forwards;
      }
      .yi-sub {
        min-height: 1.6rem;
        transition: opacity 0.22s ease;
      }
      .yi-slogan {
        margin: 0;
        font: 500 clamp(0.95rem, 3.8vw, 1.15rem) var(--f-display, system-ui), sans-serif;
        letter-spacing: 0.08em;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .yi-say .yi-slogan {
        opacity: 1;
        transform: none;
      }
      /* the app's code did not arrive: say so instead of animating for ever */
      .yi-msg {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: max(48px, env(safe-area-inset-bottom));
        display: grid;
        justify-items: center;
        gap: 16px;
        text-align: center;
        font: 500 1rem/1.4 system-ui, sans-serif;
      }
      .yi-msg[hidden] {
        display: none;
      }
      .yi-msg p {
        margin: 0;
        max-width: 28rem;
      }
      .yi-msg button {
        min-height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        border: 0;
        background: var(--yi-fg);
        color: var(--yi-bg);
        font: 600 1rem system-ui, sans-serif;
        cursor: pointer;
      }
      .yi-msg button:focus-visible {
        outline: 3px solid var(--yi-fg);
        outline-offset: 3px;
      }
      .yi-failed .yi-ring {
        animation: none;
      }
      /* the real logo waits under the overlay and takes over when the flying mark arrives */
      .brand-mark {
        transition: opacity 0.14s linear;
      }
      .yi-on .brand-mark {
        opacity: 0;
      }
      /* landing: one measured transform (FLIP) to where the shell's logo sits, while the ground clears */
      .yi-land {
        pointer-events: none;
      }
      .yi-land .yi-ground,
      .yi-land .yi-wmclip,
      .yi-land .yi-sub {
        opacity: 0;
      }
      .yi-land .yi-fly {
        transform: translate(var(--yi-dx, 0), var(--yi-dy, 0)) scale(var(--yi-ds, 1));
        opacity: 0;
        transition:
          transform 0.6s cubic-bezier(0.6, 0.05, 0.2, 1),
          opacity 0.12s linear 0.48s;
      }
      /* An early exit finds the mark still growing and still in the middle of the frame. It keeps growing, and its
         sideways offset at that moment (--yi-sx, measured) is carried into the flight, so nothing jumps. */
      .yi-land .yi-slide {
        animation: none;
        transform: translateX(var(--yi-sx, 0px));
      }
      .yi-land .yi-ring,
      .yi-land .yi-sweep {
        animation: none;
        opacity: 0;
      }
      /* a tap, Escape, the still frame's exit and an unmeasurable header: a plain opacity exit */
      .yi-fade {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s linear;
      }
      /* later visits: the finished mark with its pulse, then the flight home as soon as the app is ready */
      html[data-intro='short'] .yi-slide,
      html[data-intro='short'] .yi-tilt,
      html[data-intro='short'] .yi-node,
      html[data-intro='short'] .yi-arm,
      html[data-intro='reduced'] .yi-slide,
      html[data-intro='reduced'] .yi-tilt,
      html[data-intro='reduced'] .yi-node,
      html[data-intro='reduced'] .yi-arm,
      html[data-intro='reduced'] .yi-wm {
        animation: none;
        transform: none;
        opacity: 1;
      }
      html[data-intro='short'] .yi-wmclip,
      html[data-intro='short'] .yi-sub,
      html[data-intro='short'] .yi-sweep,
      html[data-intro='short'] .yi-ring2,
      html[data-intro='reduced'] .yi-ring,
      html[data-intro='reduced'] .yi-sweep {
        display: none;
      }
      html[data-intro='short'] .yi-ring1 {
        animation: yi-ring 0.6s ease-out forwards, yi-ring 1.6s ease-out 900ms infinite;
      }
      html[data-intro='short'] .yi-ground {
        transition-duration: 0.35s;
      }
      html[data-intro='short'] .yi-land .yi-fly {
        transition:
          transform 0.44s cubic-bezier(0.6, 0.05, 0.2, 1),
          opacity 0.1s linear 0.34s;
      }
      html[data-intro='reduced'] .yi-slogan {
        transition: none;
      }
      @keyframes yi-settle {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes yi-tilt {
        from {
          transform: perspective(640px) rotateX(26deg) rotateY(-30deg) scale(0.82);
        }
        to {
          transform: perspective(640px) rotateX(0deg) rotateY(0deg) scale(1);
        }
      }
      @keyframes yi-ring {
        0% {
          opacity: 0.5;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(5.5);
        }
      }
      @keyframes yi-sweep {
        0% {
          opacity: 0;
          transform: skewX(-18deg) translateX(0);
        }
        18%,
        82% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
          transform: skewX(-18deg) translateX(120px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="yi" class="yi" aria-hidden="true">
      <div class="yi-ground"></div>
      <div class="yi-stage">
        <div class="yi-lockup">
          <div class="yi-fly">
            <div class="yi-slide">
              <div class="yi-tilt">
                <svg class="yi-sym" viewBox="0 0 64 64">
                  <defs>
                    <mask id="yi-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">

                        <path d="M14 12 28 33Q31 37 32 40M50 12 36 33Q33 37 32 40M32 40v12" />
                      </g>

                  <circle class="yi-node yi-node3" cx="32" cy="55" r="5.5" fill="currentColor" />

                    <rect class="yi-sweep" x="-34" y="-12" width="22" height="88" />
                  </g>
                </svg>
              </div>
            </div>
          </div>
          <div class="yi-wmclip">
            <svg class="yi-wm" viewBox="80.34 17.4 134.31 31.2">
              <path fill="currentColor" d="M90.54285714285714 48.0V37.67142857142857L80.34285714285714 18.0H86.64285714285714L92.98571428571428 30.857142857142858H93.75714285714285L100.1 18.0H106.4L96.2 37.67142857142857V48.0ZM119.94285714285714 48.6Q114.28571428571428 48.6 110.94285714285714 45.49285714285715Q107.6 42.385714285714286 107.6 36.6V29.4Q107.6 23.614285714285714 110.94285714285714 20.507142857142856Q114.28571428571428 17.4 119.94285714285714 17.4Q125.6 17.4 128.94285714285712 20.507142857142856Q132.28571428571428 23.614285714285714 132.28571428571428 29.4V36.6Q132.28571428571428 42.385714285714286 128.94285714285712 45.49285714285715Q125.6 48.6 119.94285714285714 48.6ZM119.94285714285714 43.542857142857144Q123.11428571428571 43.542857142857144 124.87142857142857 41.7Q126.62857142857143 39.85714285714286 126.62857142857143 36.77142857142857V29.228571428571428Q126.62857142857143 26.142857142857142 124.87142857142857 24.299999999999997Q123.11428571428571 22.457142857142856 119.94285714285714 22.457142857142856Q116.81428571428572 22.457142857142856 115.03571428571428 24.299999999999997Q113.25714285714285 26.142857142857142 113.25714285714285 29.228571428571428V36.77142857142857Q113.25714285714285 39.85714285714286 115.03571428571428 41.7Q116.81428571428572 43.542857142857144 119.94285714285714 43.542857142857144ZM135.97142857142856 48.0V18.0H146.72857142857143L152.68571428571428 44.142857142857146H153.45714285714286V18.0H159.0285714285714V48.0H148.27142857142857L142.31428571428572 21.857142857142858H141.54285714285714V48.0ZM162.54285714285712 48.0V43.028571428571425H166.48571428571427V22.97142857142857H162.54285714285712V18.0H174.88571428571427Q180.92857142857142 18.0 184.07857142857142 21.064285714285717Q187.2285714285714 24.12857142857143 187.2285714285714 30.17142857142857V35.82857142857143Q187.2285714285714 41.871428571428574 184.07857142857142 44.93571428571428Q180.92857142857142 48.0 174.88571428571427 48.0ZM172.14285714285714 42.857142857142854H174.9             </svg>
          </div>
        </div>
        <div class="yi-sub"><p class="yi-slogan"></p></div>
      </div>
      <div id="yi-msg" class="yi-msg" role="alert" hidden>
        <p id="yi-msg-text"></p>
        <button id="yi-retry" type="button"></button>
      </div>
    </div>
    <!--
      If the app's code cannot be loaded (no connection after the page itself arrived), the animation must not run
      for ever: this shows "no connection" and a retry button. Once src/ui/Intro.tsx has taken over (`app`), the app
      shows its own errors. The texts are written in from the dictionaries at build time (vite.config.ts).
    -->
    <script id="yi-watch">
      (function () {
        var st = window.__yondoIntro, el = document.getElementById('yi');
        if (!st || !el || st.mode === 'off') return;
        var TXT = "__YONDO_INTRO_TEXT__";
        function text() {
          var lang = 'uz', abc = '';
          try {
            lang = localStorage.getItem('yondo.lang') || 'uz';
            abc = localStorage.getItem('yondo.uzAlphabet') || '';
          } catch (e) { /* storage unavailable */ }
          if (lang === 'ru' || lang === 'en') return TXT[lang];
          if (abc !== '1995' && abc !== '2026') abc = Date.now() >= TXT.from ? '2026' : '1995';
          return abc === '2026' ? TXT.uz26 : TXT.uz95;
        }
        function fail() {
          if (st.app || st.failed) return;
          var x = text();
          if (!x) return;
          st.failed = true;
          document.getElementById('yi-msg-text').textContent = x.m;
          var retry = document.getElementById('yi-retry');
          retry.textContent = x.r;
          retry.onclick = function () { location.reload(); };
          document.getElementById('yi-msg').hidden = false;
          el.classList.add('yi-failed');
          el.removeAttribute('aria-hidden');
        }
        window.addEventListener('error', function (e) { if (e.target && e.target.tagName === 'SCRIPT') fail(); }, true);
        window.addEventListener('offline', fail);
        if (navigator.onLine === false) fail();
        setTimeout(fail, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
