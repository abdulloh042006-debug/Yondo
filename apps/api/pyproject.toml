[build-system]
requires = ['setuptools>=75']
build-backend = 'setuptools.build_meta'

[project]
name = 'yondo-api'
version = '0.1.0'
description = 'Yondo marketplace API'
requires-python = '>=3.12'
dependencies = [
  'alembic>=1.14,<2',
  'fastapi>=0.115,<1',
  'psycopg[binary,pool]>=3.2,<4',
  'pydantic-settings>=2.7,<3',
  'redis>=5.2,<7',
  'sqlalchemy[asyncio]>=2.0.36,<3',
  'structlog>=24.4,<26',
  'uvicorn[standard]>=0.34,<1',
]

[project.optional-dependencies]
dev = [
  'httpx>=0.28,<1',
  'aiosqlite>=0.20,<1',
  'pytest>=8.3,<9',
  'pytest-asyncio>=0.25,<1',
  'ruff>=0.9,<1',
]

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
addopts = '-q'
testpaths = ['tests']
asyncio_mode = 'auto'

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP']
