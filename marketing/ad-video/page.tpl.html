<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SG;font-weight:700;src:url(__FS__/space-grotesk/files/space-grotesk-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:SG;font-weight:700;src:url(__FS__/space-grotesk/files/space-grotesk-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:MR;font-weight:500;src:url(__FS__/manrope/files/manrope-latin-500-normal.woff2)}

:root{--ink:#111111;--paper:#F5F2EC;--acc:#E8501A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);overflow:hidden}
#stage{position:relative;overflow:hidden;background:var(--paper);font-family:MR,system-ui,sans-serif;color:var(--ink)}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
#paperbg{inset:0;width:100%;height:100%;background:radial-gradient(120% 80% at 20% 10%,#ffffff 0%,#f5f2ec 55%,#f5f2ec 100%)}
.blob{border-radius:50%;filter:blur(90px);opacity:.1}#b2{opacity:.7}
#grid{inset:0;width:100%;height:100%;opacity:0}
#ink{inset:0;width:100%;height:100%;background:#111111}
#vignette{inset:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(130% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.18) 100%)}
.kin{font-family:SG,MR,sans-serif;font-weight:700;letter-spacing:-.035em;line-height:.98;white-space:nowrap}
.ru .kin{font-family:MR,sans-serif;font-weight:800;letter-spacing:-.03em}
.phone{border-radius:76px;background:#0d0d0d;padding:16px;box-shadow:0 60px 120px -30px rgba(17,17,17,.35),0 0 0 2px #2a2a2a inset,0 0 0 1px rgba(255,255,255,.08)}
.screen{position:relative;width:100%;height:100%;border-radius:60px;overflow:hidden;background:#F5F2EC}
.screen img,.bscreen img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:top}
.browser{border-radius:22px;background:rgba(255,255,255,.55);padding:0;box-shadow:0 50px 100px -30px rgba(17,17,17,.3),0 0 0 1px rgba(17,17,17,.08);backdrop-filter:blur(20px);overflow:hidden}
.bbar{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;background:rgba(255,255,255,.6);border-bottom:1px solid rgba(17,17,17,.06)}
.bbar i{width:13px;height:13px;border-radius:50%;background:rgba(17,17,17,.16);display:block}
.bbar b{margin-left:18px;flex:1;height:24px;border-radius:12px;background:rgba(17,17,17,.06);font:500 13px MR;color:rgba(17,17,17,.6);display:flex;align-items:center;padding-left:14px}
.bscreen{position:relative;width:100%;overflow:hidden}
.chip{padding:.5em 1em;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 12px 30px -10px rgba(17,17,17,.25),inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(17,17,17,.06);font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:.5em}
.chip .dot{width:.55em;height:.55em;border-radius:50%;background:var(--acc)}
.chip .ic{width:1.2em;height:1.2em;color:var(--acc);flex:none}
#sub{left:50%;width:max-content;padding:.42em .9em;border-radius:18px;background:rgba(17,17,17,.78);color:#fff;font-weight:500;text-align:center;line-height:1.32;backdrop-filter:blur(8px)}
#tap{border-radius:50%;border:4px solid rgba(255,255,255,.95);background:rgba(232,80,26,.25);width:90px;height:90px;margin:-45px 0 0 -45px;box-shadow:0 0 0 2px rgba(232,80,26,.6)}
#demo{padding:.35em .8em;border-radius:999px;background:rgba(17,17,17,.82);color:#f5f2ec;font-weight:800;letter-spacing:.08em;font-size:22px}
#flash{inset:0;width:100%;height:100%;background:#fff;opacity:0;mix-blend-mode:screen}
#endpill{padding:.4em 1.1em;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:800}
svg{overflow:visible}

<body>
<div id="stage">
  <div id="paperbg" class="abs"></div>
  <div id="b1" class="abs blob"></div><div id="b2" class="abs blob"></div><div id="b3" class="abs blob"></div>
  <svg id="grid" class="abs"></svg>
  <svg id="wander" class="abs" style="inset:0;width:100%;height:100%"></svg>
  <div id="browser" class="abs browser"><div class="bbar"><i></i><i></i><i></i><b>yondo</b></div><div class="bscreen" id="bscreen"></div></div>
  <div id="phone" class="abs phone"><div class="screen" id="pscreen"></div></div>
  <div id="tap" class="abs"></div>
  <div id="chips"></div>
  <div id="head" class="abs kin"></div>
  <div id="pin" class="abs"></div>
  <div id="demo" class="abs"></div>
  <div id="ink" class="abs"></div>
  <svg id="scene" class="abs" style="inset:0;width:100%;height:100%"></svg>
  <svg id="lines" class="abs" style="inset:0;width:100%;height:100%"></svg>
  <div id="kinwrap"></div>
  <div id="logo" class="abs"></div>
  <div id="endtxt"></div>
  <div id="vignette" class="abs"></div>
  <div id="sub" class="abs"></div>
  <div id="flash" class="abs"></div>
</div>
<script>
const TL_ALL = __TIMELINE__;
const WORDMARK = `__WORDMARK__`;
const SHOTS = __SHOTS__;
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') || 'v', LANG = q.get('lang') || 'uz';
const TL = TL_ALL[LANG], TX = TL.text, V = TL.V;
const W = FMT === 'v' ? 1080 : 1920, H = FMT === 'v' ? 1920 : 1080;
const VERT = FMT === 'v';
const $ = (id) => document.getElementById(id);
const stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
if (LANG === 'ru') stage.classList.add('ru');

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 4);           // ease-out quart ~ cubic-bezier(.2,0,0,1)
const eio = (x) => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2;
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const inOut = (t, a, b, fi = .4, fo = .35) => Math.min(eo(lin(t, a, a + fi)), 1 - eo(lin(t, b - fo, b)));
function css(el, o) {
  const tr = `translate(${o.x || 0}px,${o.y || 0}px) scale(${o.s ?? 1}) rotate(${o.r || 0}deg)` + (o.extra || '');
  el.style.transform = tr;
  if (o.o !== undefined) el.style.opacity = o.o;
  if (o.blur !== undefined) el.style.filter = o.blur > 0.05 ? `blur(${o.blur}px)` : 'none';
}

/* ---------- layout ---------- */
const LY = VERT ? {
  phone: { w: 640, x: (1080 - 640) / 2, y: 610 }, head: { x: 72, y: 230, size: 84 }, kin: 118,
  sub: { y: 1500, size: 40, max: 900 }, chipSize: 38, demo: { x: 1080 - 72, y: 120 }, logoW: 760,
} : {
  phone: { w: 286, x: 610, y: 360 }, head: { x: 110, y: 210, size: 70 }, kin: 120,
  browser: { w: 1060, x: 760, y: 140 },
  sub: { y: 968, size: 32, max: 1300 }, chipSize: 30, demo: { x: 1920 - 96, y: 70 }, logoW: 820,
};
const ph = $('phone'); const PW = LY.phone.w, PH = Math.round(PW * 2110 / 975) + 32;
ph.style.width = (PW + 32) + 'px'; ph.style.height = PH + 'px';
const PHX = LY.phone.x - 16, PHY = LY.phone.y;
const br = $('browser');
if (!VERT) { br.style.width = LY.browser.w + 'px'; $('bscreen').style.height = Math.round(LY.browser.w * 800 / 1280) + 'px'; }
else br.style.display = 'none';

/* screens */
function addImgs(host, names) { const m = {}; for (const n of names) { const i = new Image(); i.src = SHOTS + '/' + n + '.png'; i.style.opacity = 0; host.appendChild(i); m[n] = i; } return m; }
const MS = addImgs($('pscreen'), ['m-discovery', 'n/m-discovery', 'm-discovery-scrolled', 'm-profile-services', 'm-profile', 'm-booking-dialog', 'm-bookings', 'm-admin-detail', 'm-admin-confirm']);
const DS = VERT ? {} : addImgs($('bscreen'), ['d-discovery', 'n/d-discovery', 'd-discovery-scrolled', 'd-profile', 'd-profile-services', 'd-booking-dialog', 'd-bookings', 'd-admin-detail', 'd-admin-confirm']);

/* blobs */
const BL = [['b1', '#E8501A', .9], ['b2', '#FFFFFF', .75], ['b3', '#E8501A', .6]];
BL.forEach(([id, c, k]) => { const e = $(id); const s = (VERT ? 900 : 1100) * k; e.style.width = e.style.height = s + 'px'; e.style.background = c; });

/* grid (city lines) */
(function () {
  const g = $('grid'); let h = '';
  for (let x = -200; x < W + 200; x += 120) h += `<line x1="${x}" y1="-50" x2="${x + 260}" y2="${H + 50}" stroke="#111" stroke-opacity=".06" stroke-width="2"/>`;
  for (let y = 0; y < H; y += 140) h += `<line x1="-50" y1="${y}" x2="${W + 50}" y2="${y + 60}" stroke="#111" stroke-opacity=".05" stroke-width="2"/>`;
  g.innerHTML = h;
})();

/* symbol svg (64 units) */
const SYM = (stroke, node) => `<svg viewBox="0 0 64 64" width="100%" height="100%"><g stroke="${stroke}" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
<path class="armL" pathLength="1" d="M14 12 28 33Q31 37 32 40"/><path class="armR" pathLength="1" d="M50 12 36 33Q33 37 32 40"/><path class="stem" pathLength="1" d="M32 40v12"/></g>
<circle class="nL" cx="14" cy="12" r="7" fill="${node}"/><circle class="nR" cx="50" cy="12" r="7" fill="#E8501A"/><circle class="nB" cx="32" cy="55" r="5.5" fill="${node}"/></svg>`;
const logo = $('logo');
logo.innerHTML = `<svg viewBox="0 0 219 64" width="${LY.logoW}" style="display:block"><g id="lsym"><g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
<path id="la" pathLength="1" d="M14 12 28 33Q31 37 32 40"/><path id="lb" pathLength="1" d="M50 12 36 33Q33 37 32 40"/><path id="lc" pathLength="1" d="M32 40v12"/></g>
<circle id="ln1" cx="14" cy="12" r="7" fill="currentColor"/><circle id="ln2" cx="50" cy="12" r="7" fill="#E8501A"/><circle id="ln3" cx="32" cy="55" r="5.5" fill="currentColor"/></g>
<g id="lwm">${WORDMARK}</g></svg><div id="slog" class="kin" style="text-align:center;margin-top:${VERT ? 34 : 26}px;font-size:${VERT ? 78 : 64}px"></div>`;
$('slog').textContent = TX.slogan;
const LH = LY.logoW * 64 / 219;

/* lines svg for intro/end: two nodes + two strokes */
$('lines').innerHTML = `<line id="Ll" stroke="#F5F2EC" stroke-width="10" stroke-linecap="round"/><line id="Lr" stroke="#F5F2EC" stroke-width="10" stroke-linecap="round"/>
<circle id="Nl" r="26" fill="#F5F2EC"/><circle id="Nr" r="26" fill="#E8501A"/><circle id="ring" r="10" fill="none" stroke="#F5F2EC" stroke-width="4"/>`;
$('wander').innerHTML = `<path id="w1" fill="none" stroke="#111" stroke-opacity=".75" stroke-width="7" stroke-linecap="round"/><path id="w2" fill="none" stroke="#E8501A" stroke-width="7" stroke-linecap="round"/>
<circle id="wn1" r="16" fill="#111"/><circle id="wn2" r="16" fill="#E8501A"/>`;

/* kinetic phrase elements */
function mkKin(list, size, color) { return list.map((t) => { const d = document.createElement('div'); d.className = 'abs kin'; d.textContent = t; d.style.fontSize = size + 'px'; d.style.color = color; $('kinwrap').appendChild(d); const maxw = W - (VERT ? 144 : 280); if (d.offsetWidth > maxw) d.style.fontSize = (size * maxw / d.offsetWidth) + 'px'; return d; }); }
const kinSize = VERT ? 112 : 128;
const K1 = mkKin(TX.v1, kinSize, '#F5F2EC');
const K2 = mkKin(TX.v2, kinSize * .86, '#111');
const K6 = mkKin([TX.v6[0]], VERT ? 86 : 96, '#111');
const ICON = { cup: '<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 11h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M8 3c0 2 2 2 2 4M12 3c0 2 2 2 2 4"/>', steps: '<path d="M7 21c-2 0-3-2-2.5-4.5S6 12 8 12s2.5 2 2 4.5S9 21 7 21z"/><path d="M16 12c-2 0-2.5-2-2-4.5S15.5 3 17.5 3 20 5 19.5 7.5 18 12 16 12z"/>', talk: '<path d="M3 4h11v8H8l-3 3v-3H3z"/><path d="M10 14v2h6l3 3v-3h2V8h-4"/>', globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3.5 3.5 14.5 0 18M12 3c-3.5 3.5-3.5 14.5 0 18"/>', book: '<path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1z"/><path d="M21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z"/>', compass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>', shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>' };
function chip(text, size, ic) { const d = document.createElement('div'); d.className = 'abs chip'; d.innerHTML = (ic ? `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[ic]}</svg>` : '<span class="dot"></span>') + text; d.style.fontSize = size + 'px'; $('chips').appendChild(d); return d; }
const C3 = TX.v3chips.map((t, i) => chip(t, LY.chipSize + 4, ['cup', 'steps', 'talk'][i]));
const C4 = TX.v4chips.map((t, i) => chip(t, LY.chipSize, ['globe', 'book', 'compass', 'tag'][i]));
const CP = chip(LANG === 'ru' ? '150 000 сум' : '150 000 so‘m', LY.chipSize, 'tag'); // matches the Kofe price on the apps/web booking screen (capture_proto.mjs screens show 110 000)
const CS = chip(TX.v5[2], LY.chipSize, 'cal');
const CA = chip(TX.v6[1], LY.chipSize, 'shield');
$('demo').style.display = 'none';
$('pin').innerHTML = `<svg viewBox="0 0 48 64" width="${VERT ? 120 : 110}"><path d="M24 2C12 2 3 11 3 23c0 16 21 38 21 38s21-22 21-38C45 11 36 2 24 2z" fill="#111"/><circle cx="24" cy="23" r="8" fill="#E8501A"/></svg>`;
// end texts
$('endtxt').innerHTML = `<div id="e1" class="abs kin" style="font-size:${VERT ? 104 : 96}px;color:#F5F2EC"></div><div id="e2" class="abs" ><span id="endpill" style="font-size:${VERT ? 46 : 40}px"></span></div><div id="e3" class="abs" style="font:500 ${VERT ? 26 : 22}px MR;color:rgba(245,242,236,.62)"></div>`;
$('e1').textContent = TX.end1; $('endpill').textContent = TX.end2; $('e3').textContent = '';
const sub = $('sub'); sub.style.fontSize = LY.sub.size + 'px'; sub.style.maxWidth = LY.sub.max + 'px';

/* ---------- illustrations: line art in the brand palette only (ink / paper / carrot), drawn on with stroke-dashoffset ---------- */
const scene = $('scene');
const NS = 'http://www.w3.org/2000/svg';
const UM = Math.min(W, H) / 1080;
function sv(tag, at, parent) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); (parent || scene).appendChild(e); return e; }
function grp(parent) { return sv('g', {}, parent); }
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
function mkP(g, lines, color) { return (d, w = 4, extra = {}) => { const p = sv('path', Object.assign({ d, fill: 'none', stroke: color, 'stroke-width': w * UM, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1 }, extra), g); lines.push(p); return p; }; }
function orderLines(lines) { lines.forEach((p) => { const b = p.getBBox(); p._x = b.x + b.width / 2; }); }
function drawSet(lines, k, span = .55) {
  for (const p of lines) { const off = clamp((p._x || 0) / W) * (1 - span); const l = eo(clamp((k - off) / span)); p.style.strokeDasharray = 1; p.style.strokeDashoffset = 1 - l; }
}
function popSet(els, k, from = .45, to = .95) { els.forEach((e, i) => { const a = from + (to - from) * (i / Math.max(1, els.length)); const x = clamp((k - a) / .08); e.setAttribute('opacity', x); }); }

function person(g, lines, x, y, s, color, w = 6) {
  const P = mkP(g, lines, color);
  P(`M${x - 28 * s} ${y - 150 * s}a${28 * s} ${28 * s} 0 1 1 ${56 * s} 0a${28 * s} ${28 * s} 0 1 1 ${-56 * s} 0`, w);
  P(`M${x - 55 * s} ${y}V${y - 55 * s}Q${x - 55 * s} ${y - 106 * s} ${x} ${y - 106 * s}Q${x + 55 * s} ${y - 106 * s} ${x + 55 * s} ${y - 55 * s}V${y}`, w);
}
function skyline(color, baseY, hMax, sd) {
  seed = sd; const g = grp(); const lines = [], wins = []; const P = mkP(g, lines, color);
  const tower = W * .76, dome = W * .22; let x = -20;
  while (x < W + 20) {
    const bw = (60 + rnd() * 90) * UM, bh = hMax * (.25 + rnd() * .6);
    if (Math.abs(x + bw / 2 - tower) < 80 * UM || Math.abs(x + bw / 2 - dome) < 150 * UM) { x += 40 * UM; continue; }
    const top = baseY - bh; P(`M${x} ${baseY}V${top}H${x + bw}V${baseY}`);
    if (bw > 70 * UM) for (let wy = top + 18 * UM; wy < baseY - 26 * UM; wy += 34 * UM) for (let wx = x + 14 * UM; wx < x + bw - 20 * UM; wx += 26 * UM) if (rnd() < .3 && wins.length < 60) wins.push(sv('rect', { x: wx, y: wy, width: 10 * UM, height: 14 * UM, rx: 2 * UM, fill: '#E8501A', opacity: 0 }, g));
    x += bw + (8 + rnd() * 14) * UM;
  }
  const th = hMax * 1.75;
  P(`M${tower - 30 * UM} ${baseY}L${tower - 6 * UM} ${baseY - th * .55}V${baseY - th * .9}M${tower + 30 * UM} ${baseY}L${tower + 6 * UM} ${baseY - th * .55}V${baseY - th * .9}M${tower} ${baseY - th * .9}V${baseY - th}`);
  P(`M${tower - 26 * UM} ${baseY - th * .6}h${52 * UM}v${-20 * UM}h${-52 * UM}zM${tower - 17 * UM} ${baseY - th * .8}h${34 * UM}v${-14 * UM}h${-34 * UM}z`);
  wins.push(sv('circle', { cx: tower, cy: baseY - th, r: 7 * UM, fill: '#E8501A', opacity: 0 }, g));
  const dr = 66 * UM, dy = baseY - hMax * .42;
  P(`M${dome - dr * 1.15} ${baseY}V${dy}H${dome + dr * 1.15}V${baseY}M${dome - 22 * UM} ${baseY}v${-40 * UM}a${22 * UM} ${22 * UM} 0 0 1 ${44 * UM} 0v${40 * UM}`);
  P(`M${dome - dr} ${dy}A${dr} ${dr * 1.05} 0 0 1 ${dome + dr} ${dy}M${dome} ${dy - dr * 1.05}v${-24 * UM}`);
  for (const s of [-1, 1]) { const mx = dome + s * dr * 1.7; P(`M${mx - 10 * UM} ${baseY}V${baseY - hMax * 1.05}h${20 * UM}V${baseY}M${mx - 14 * UM} ${baseY - hMax * 1.05}l${14 * UM} ${-34 * UM}l${14 * UM} ${34 * UM}`); }
  P(`M-40 ${baseY}H${W + 40}`, 3);
  orderLines(lines); return { g, lines, wins };
}
function cityMap(color) {
  const g = grp(); const lines = [], route = [], pins = []; const P = mkP(g, lines, color);
  for (let i = 0; i < 8; i++) { const y = H * (.06 + .125 * i); P(`M-40 ${y}C${W * .3} ${y + 40 * UM * Math.sin(i * 1.7)} ${W * .6} ${y - 50 * UM * Math.cos(i)} ${W + 40} ${y + 20 * UM}`, 3); }
  const nx = VERT ? 6 : 9; for (let i = 0; i < nx; i++) { const x = W * (.06 + (.9 / (nx - 1)) * i); P(`M${x} -40C${x + 60 * UM} ${H * .3} ${x - 50 * UM} ${H * .6} ${x + 30 * UM} ${H + 40}`, 3); }
